# Job Market Tool Configuration

# Growth score weights (must sum to 100)
weights:
  posting_count_yoy: 30
  median_pay_yoy: 30
  projected_10yr_growth: 25
  inverse_hhi: 15

# Location filter for posting drilldown
location:
  default: "San Francisco"
  remote: true

# Refresh cadence
refresh:
  cadence: "weekly"
  day: "sunday"
  time: "06:00"

# Data sources
sources:
  bls:
    enabled: true
    api_key: null  # Set via BLS_API_KEY env var or config.local.yaml
    series:
      - oews  # Occupational Employment and Wage Statistics
      - emp_projections  # 10-year employment projections

  muse:
    enabled: true
    rate_limit_delay: 1  # seconds between requests

  remoteok:
    enabled: true

  usajobs:
    enabled: true
    user_agent: "job-market-tool/contact@example.com"

  adzuna:
    enabled: false  # Requires API key — enable in Phase 5
    app_id: null
    app_key: null
    country: "us"

# Knowledge-work SOC code prefixes (15-XX through 29-XX + 11-XX + 13-XX)
soc_filter:
  prefixes:
    - "11"  # Management
    - "13"  # Business and Financial Operations
    - "15"  # Computer and Mathematical
    - "17"  # Architecture and Engineering
    - "19"  # Life, Physical, and Social Science
    - "21"  # Community and Social Service
    - "23"  # Legal
    - "25"  # Educational Instruction and Library
    - "27"  # Arts, Design, Entertainment, Sports, and Media
    - "29"  # Healthcare Practitioners (knowledge-work subset)

# DuckDB
database:
  path: "data/jobs.duckdb"
